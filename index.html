<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e17" />
    <title>NEXA AI</title>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <h1>NEXA AI</h1>
        </div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en">English</button>
          <button type="button" class="lang-btn" data-lang="ha">Hausa</button>
        </div>
      </header>

      <div class="subbar">
        <span id="tagline" class="tagline"></span>
        <label class="switch">
          <input type="checkbox" id="voiceReplies" />
          <span class="track" aria-hidden="true"></span>
          <span id="voiceRepliesLabel" class="switch-label"></span>
        </label>
      </div>

      <main id="chat" class="chat" aria-live="polite"></main>

      <div id="status" class="status" role="status"></div>

      <form id="composer" class="composer" autocomplete="off">
        <input id="input" type="text" enterkeyhint="send" autocomplete="off" />
        <button type="button" id="micBtn" class="icon-btn" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-3.07A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"
            />
          </svg>
        </button>
        <button type="button" id="speakBtn" class="icon-btn" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8.77v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54Z"
            />
          </svg>
        </button>
        <button type="submit" id="sendBtn" class="send-btn"></button>
      </form>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
